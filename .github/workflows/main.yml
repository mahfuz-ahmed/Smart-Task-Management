name: Build and Deploy to SmarterASP.NET

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------- Angular ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Angular Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Angular
        working-directory: frontend
        run: npm run build -- --configuration production

      # ---------- .NET 8 ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: backend/SmartTaskManagement
        run: dotnet restore SmartTaskManagement.slnx

      - name: Publish API (.NET 8 framework-dependent)
        working-directory: backend/SmartTaskManagement
        run: dotnet publish src/SmartTaskManagement.API/SmartTaskManagement.API.csproj --configuration Release --output ../../deploy

      # ---------- Copy Angular Assets to deploy/wwwroot ----------
      - name: Prepare wwwroot and logs folders
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "./deploy/wwwroot"
          New-Item -ItemType Directory -Force -Path "./deploy/logs"
          Remove-Item -Recurse -Force "./deploy/wwwroot/*" -ErrorAction SilentlyContinue
          if (Test-Path "./frontend/dist/frontend/browser") {
            Write-Host "Copying from frontend/dist/frontend/browser"
            Copy-Item -Path "./frontend/dist/frontend/browser/*" -Destination "./deploy/wwwroot/" -Recurse -Force
          } elseif (Test-Path "./frontend/dist/browser") {
            Write-Host "Copying from frontend/dist/browser"
            Copy-Item -Path "./frontend/dist/browser/*" -Destination "./deploy/wwwroot/" -Recurse -Force
          } else {
            Write-Host "Copying from frontend/dist"
            Copy-Item -Path "./frontend/dist/*" -Destination "./deploy/wwwroot/" -Recurse -Force
          }
          Write-Host "wwwroot index.html present: $(Test-Path './deploy/wwwroot/index.html')"
          Write-Host "web.config present: $(Test-Path './deploy/web.config')"

      # ---------- Deploy via FTP ----------
      - name: Deploy to SmarterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SERVER_COMPUTER_NAME }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /
          dangerous-clean-slate: true
