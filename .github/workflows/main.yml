name: Build and Deploy to SmarterASP.NET

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------- Angular ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Angular Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Angular
        working-directory: frontend
        run: npm run build -- --configuration production

      # ---------- .NET ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend/SmartTaskManagement
        run: dotnet restore SmartTaskManagement.slnx

      - name: Build
        working-directory: backend/SmartTaskManagement
        run: dotnet build SmartTaskManagement.slnx --configuration Release --no-restore

      - name: Publish API
        working-directory: backend/SmartTaskManagement
        run: dotnet publish src/SmartTaskManagement.API/SmartTaskManagement.API.csproj --configuration Release --no-build --output ../../publish

      # ---------- Copy Angular ----------
      - name: Copy Angular Build
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "./publish/wwwroot"
          Remove-Item -Recurse -Force "./publish/wwwroot/*" -ErrorAction SilentlyContinue
          Copy-Item -Path "./frontend/dist/*" -Destination "./publish/wwwroot/" -Recurse -Force

      # ---------- Deploy ----------
      - name: Deploy to SmarterASP.NET
        shell: powershell
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$(pwd)\publish" `
            -dest:contentPath="${{ secrets.WEBSITE_NAME }}",ComputerName="${{ secrets.SERVER_COMPUTER_NAME }}",UserName="${{ secrets.SERVER_USERNAME }}",Password="${{ secrets.SERVER_PASSWORD }}",AuthType="Basic" `
            -allowUntrusted `
            -enableRule:AppOffline `
            -enableRule:DoNotDeleteRule
