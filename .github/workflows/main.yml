name: Build and Deploy to SmarterASP.NET

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------- Angular ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Angular Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Angular
        working-directory: frontend
        run: npm run build -- --configuration production

      # ---------- .NET ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend/SmartTaskManagement
        run: dotnet restore SmartTaskManagement.slnx

      - name: Publish API (Self-Contained 32-bit x86 for SmarterASP.NET)
        working-directory: backend/SmartTaskManagement
        run: dotnet publish src/SmartTaskManagement.API/SmartTaskManagement.API.csproj --configuration Release --runtime win-x86 --self-contained true --output ../../publish

      # ---------- Copy Angular Assets to wwwroot ----------
      - name: Copy Angular Build to wwwroot
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "./publish/wwwroot"
          Remove-Item -Recurse -Force "./publish/wwwroot/*" -ErrorAction SilentlyContinue
          if (Test-Path "./frontend/dist/frontend/browser") {
            Copy-Item -Path "./frontend/dist/frontend/browser/*" -Destination "./publish/wwwroot/" -Recurse -Force
          } elseif (Test-Path "./frontend/dist/browser") {
            Copy-Item -Path "./frontend/dist/browser/*" -Destination "./publish/wwwroot/" -Recurse -Force
          } else {
            Copy-Item -Path "./frontend/dist/*" -Destination "./publish/wwwroot/" -Recurse -Force
          }

      # ---------- Deploy via FTP ----------
      - name: Deploy to SmarterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SERVER_COMPUTER_NAME }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          local-dir: ./publish/
          server-dir: /taskmangement/
