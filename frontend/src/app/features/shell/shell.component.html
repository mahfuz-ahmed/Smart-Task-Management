<div class="shell" [class.sidebar-collapsed]="sidebarCollapsed()">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="main-sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <span class="brand-name">SmartTask</span>
      </div>
      <button class="sidebar-toggle btn-icon btn-ghost" (click)="toggleSidebar()" id="sidebar-toggle-btn" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- User profile mini -->
    <div class="sidebar-user">
      <div class="avatar avatar-sm">{{ userInitials() }}</div>
      <div class="user-info">
        <div class="user-name">{{ user()?.fullName }}</div>
        <div class="user-role badge badge-primary">{{ user()?.role }}</div>
      </div>
    </div>

    <!-- Nav links -->
    <nav class="sidebar-nav" aria-label="Main navigation">
      <div class="nav-section">
        <div class="nav-section-label">Overview</div>
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" id="nav-dashboard">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
          </span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a routerLink="/my-tasks" routerLinkActive="active" class="nav-item" id="nav-my-tasks">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
            </svg>
          </span>
          <span class="nav-label">My Tasks</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-label">Workspace</div>
        <a routerLink="/projects" routerLinkActive="active" class="nav-item" id="nav-projects">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
            </svg>
          </span>
          <span class="nav-label">Projects</span>
        </a>
      </div>
    </nav>

    <!-- Sidebar footer -->
    <div class="sidebar-footer">
      <button class="nav-item nav-item-btn" id="logout-btn" (click)="onLogout()">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </span>
        <span class="nav-label">Logout</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn btn-ghost btn-icon hide-desktop" (click)="toggleSidebar()" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="page-breadcrumb">
          <span class="brand-name-mobile">⚡ SmartTask</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-user">
          <div class="avatar">{{ userInitials() }}</div>
          <div class="user-details hide-mobile">
            <div class="user-name">{{ user()?.fullName }}</div>
            <div class="user-email">{{ user()?.email }}</div>
          </div>
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content" id="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile overlay -->
  @if (!sidebarCollapsed()) {
    <div class="mobile-overlay hide-desktop" (click)="toggleSidebar()"></div>
  }
</div>
